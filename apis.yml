aid: docket
name: Docket
description: >-
  Docket (docket.io, formerly DocketAI) is an AI marketing agent for B2B teams
  that engages website visitors in real-time conversations to answer product
  questions from verified knowledge, qualify buyer intent, and book meetings
  directly into the CRM. It converts inbound traffic into "Agent Qualified
  Leads" (AQLs) using real-time visitor profiling from CRM history and intent
  signals, reasoning-based responses powered by its Sales Knowledge Lake (which
  ingests 50+ data sources including Salesforce, HubSpot, Gong, Slack, Google
  Drive, Notion and SharePoint), and multi-channel voice/text support across
  40+ languages. Docket deploys via a JavaScript snippet with no engineering
  required, and is offered as an annual SaaS subscription rather than a public
  developer API. The company is SOC 2 Type II and ISO 27001 certified and GDPR
  compliant, and is backed by Mayfield.
